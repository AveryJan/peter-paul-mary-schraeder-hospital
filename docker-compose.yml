services:
  mongo:
    image: mongo:7
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongo_data:/data/db]
  node-api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: [MONGO_URI=mongodb://mongo:27017, MONGO_DB=schraeder_demo]
    ports: ['127.0.0.1:3001:3001']
    depends_on: [mongo]
  python-api:
    build: {context: ., dockerfile: python_service/Dockerfile}
    ports: ['127.0.0.1:8000:8000']
volumes:
  mongo_data:
