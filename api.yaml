# Example staging-only manifest; not configured for production healthcare data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schraeder-python-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: schraeder-python-api}
  template:
    metadata:
      labels: {app: schraeder-python-api}
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/schraeder-python-api:YOUR_TAG
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: schraeder-python-api
spec:
  type: ClusterIP
  selector: {app: schraeder-python-api}
  ports: [{port: 80, targetPort: 8000}]
