name: synthetic-health-platform-ci
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r python_service/requirements.txt pytest
      - run: pytest tests -q
  model-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r mlops/requirements.txt
      - run: python mlops/train.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-model-metrics
          path: mlops/artifacts/metrics.json
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm install && npm run build
